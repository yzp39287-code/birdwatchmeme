<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>珠颈斑鸠街区历险记</title>
<style>
  /* ================= 页面样式：画布等比缩放自适应窗口 ================= */
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  body {
    background: radial-gradient(1200px 700px at 50% 40%, #4a4038 0%, #2b2420 60%, #1c1714 100%);
    display: flex; align-items: center; justify-content: center;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  #game {
    background: #9fd4ec;
    border-radius: 12px;
    box-shadow: 0 18px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
    display: block;
  }
  .mobile-controls { display: none; position: fixed; inset: 0; z-index: 5; pointer-events: none; }
  .mobile-controls button { position: absolute; width: 58px; height: 58px; border: 1px solid rgba(255,255,255,.6); border-radius: 50%; background: rgba(24,61,39,.72); color: #fff; font: 800 25px/1 sans-serif; box-shadow: 0 4px 14px rgba(0,0,0,.25); pointer-events: auto; touch-action: none; -webkit-tap-highlight-color: transparent; }
  .mobile-controls button:active { background: rgba(182,236,19,.88); color: #173d27; transform: scale(.94); }
  .control-left { left: 18px; bottom: 28px; }
  .control-right { left: 142px; bottom: 28px; }
  .control-up { left: 80px; bottom: 91px; }
  .control-down { left: 80px; bottom: 12px; }
  .control-flap { right: 24px; bottom: 34px; width: 78px !important; height: 78px !important; font-size: 17px !important; }
  @media (hover: none), (pointer: coarse) { .mobile-controls { display: block; } }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<div class="mobile-controls" aria-label="手机游戏控制器">
  <button class="control-left" data-control="left" aria-label="向左">◀</button>
  <button class="control-right" data-control="right" aria-label="向右">▶</button>
  <button class="control-up" data-control="up" aria-label="向上">▲</button>
  <button class="control-down" data-control="down" aria-label="向下">▼</button>
  <button class="control-flap" data-control="jump" aria-label="扑翼加速">扑翼</button>
</div>
<noscript>需要启用 JavaScript 才能运行本游戏。</noscript>
<script>
(() => {
'use strict';

/* ============================================================================
 * 1. CONFIG —— 全部可调数值集中在此（含中文注释，方便调难度/节奏）
 * ========================================================================== */
const CONFIG = {
  VIEW_W: 1280, VIEW_H: 720,      // 画布逻辑分辨率（等比缩放自适应窗口）
  WORLD_WIDTH: 3400,              // 横向卷轴世界总宽
  GOAL_SCORE: 1000,               // 通关积分
  DEBUG: false,                   // 调试模式：显示安全区/状态；[ ]加减分 K召唤游隼 H传送树林

  // 三个行走层的脚底 Y（地面两条街 + 楼房窗台）
  ROW_Y: { street: 700, sidewalk: 604, sill: 452 },

  // ---- 珠颈斑鸠 ----
  DOVE: {
    speed: 240,        // 常规移动速度 px/s
    dashMul: 1.85,     // 扑翼加速倍率（240*1.85=444 > 游隼俯冲 400，可用来逃生）
    dashTime: 0.55,    // 加速持续时间 s
    dashCd: 1.2,       // 扑翼加速冷却 s
    flyTime: 0.55,     // 飞上窗台耗时 s
    dropTime: 0.42,    // 跳回地面耗时 s
    eatRange: 38,      // 拾取食物的横向半径
    safeMargin: 36,    // “完全进入”安全区所需的内缩距离（保证要整个身子进树林）
  },

  // ---- 游隼（整体难度中等偏下）----
  FALCON: {
    safeTime: 8,             // 开局安全期 s
    warnTime: 1.5,           // 来袭预警时长 s（阴影+啸叫+红色警示框）
    stayTime: 4.5,           // 每次巡逻在场上停留约 4.5s 后飞出画面
    gapMin: 7, gapMax: 11,   // 离场后到下次预警的间隔（合计约 14±2s 一轮巡逻）
    enterTime: 1.0,          // 入场飞入耗时 s
    patrolTimeMin: 1.0,      // 巡航最短 s
    patrolTimeMax: 1.8,      // 巡航最长 s（之后俯冲）
    glideSpeed: 320,         // 巡航滑翔速度
    diveSpeed: 400,          // 俯冲速度（必须略低于斑鸠扑翼加速 444）
    steerRate: 2.1,          // 俯冲转向速率（惯性转向，不能瞬瞄）
    catchRadius: 38,         // 隼爪与斑鸠身体的重叠判定半径
  },

  // ---- 食物系统 ----
  FOOD: {
    CAP: 12,                // 地图食物同时存在上限
    LIFE: 15,               // 食物未被吃掉后消失时间 s
    sillInterval: 1.5,      // 窗台撒落生成间隔（主力来源，频率高）
    streetInterval: 5.0,    // 路面掉落生成间隔（频率低）
    sillCluster: [3, 6],    // 窗台一次撒落的粒数范围
    streetCluster: [1, 2],  // 路面一次掉落的粒数范围
    INFO: {
      millet:  { label: '小米',   score: 1 },   // 小米 1 分
      corn:    { label: '玉米',   score: 2 },   // 玉米 2 分
      peanut:  { label: '花生米', score: 3 },   // 花生米 3 分
    },
    // 难度三档：分值越高概率越低；随积分推进高级食物权重下降 + 整体刷新率约 -15%/档
    TIERS: [
      { minScore: 0,   weights: { millet: 6,   corn: 3,   peanut: 1   }, rateMul: 1    },
      { minScore: 300, weights: { millet: 7,   corn: 2.2, peanut: 0.6 }, rateMul: 0.85 },
      { minScore: 700, weights: { millet: 7.5, corn: 1.7, peanut: 0.4 }, rateMul: 0.72 },
    ],
  },

  // ---- 场景布局（x 为世界坐标；groves 为小树林安全区）----
  SCENE: {
    buildings: [   // 居民楼：x0..x1 占位，top 楼顶 Y（楼底统一 562）
      { x0: 120,  x1: 600,  top: 205, wall: '#F5E7CE', trim: '#D9A468' },
      { x0: 900,  x1: 1440, top: 165, wall: '#EDE4F0', trim: '#B49BC8' },
      { x0: 1680, x1: 2240, top: 195, wall: '#F7E9CF', trim: '#D9A468' },
      { x0: 2500, x1: 3040, top: 175, wall: '#EAE9EF', trim: '#AEB8D2' },
    ],
    groves: [      // 小树林（乔木+灌木）：cx 中心 / width 安全带宽度
      { cx: 750,  width: 270 },
      { cx: 1560, width: 220 },
      { cx: 2370, width: 230 },
    ],
  },
};

/* ============================================================================
 * 2. 通用工具
 * ========================================================================== */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, k) => a + (b - a) * k;
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const easeOut = k => 1 - (1 - k) * (1 - k);
const easeIn  = k => k * k;
const easeInOut = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
// 确定性伪随机（场景装饰用，保证每次打开画面一致）
function makeRng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

/* ============================================================================
 * 3. 画布与自适应缩放
 * ========================================================================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function fitCanvas() {
  const s = Math.min(window.innerWidth / CONFIG.VIEW_W, window.innerHeight / CONFIG.VIEW_H);
  canvas.style.width  = Math.floor(CONFIG.VIEW_W * s) + 'px';
  canvas.style.height = Math.floor(CONFIG.VIEW_H * s) + 'px';
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

/* ============================================================================
 * 4. 输入管理（键盘 + 鼠标 + 触屏）
 * ========================================================================== */
const Input = {
  down: new Set(), pressed: new Set(),
  mouse: { x: 0, y: 0, clicked: false },
  map: { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
         ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', Space: 'jump' },
  init() {
    window.addEventListener('keydown', e => {
      if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
      Sound.ensure();
      if (e.repeat) return;
      const n = this.map[e.code];
      if (n) { this.down.add(n); this.pressed.add(n); }
      this.onKey(e.code);
    });
    window.addEventListener('keyup', e => { const n = this.map[e.code]; if (n) this.down.delete(n); });
    canvas.addEventListener('mousemove', e => { const p = toLogical(e); this.mouse.x = p.x; this.mouse.y = p.y; });
    canvas.addEventListener('mousedown', e => { const p = toLogical(e); this.mouse.x = p.x; this.mouse.y = p.y; this.mouse.clicked = true; Sound.ensure(); });
    canvas.addEventListener('pointerdown', e => {
      if (e.pointerType !== 'mouse') {
        e.preventDefault();
        const p = toLogical(e); this.mouse.x = p.x; this.mouse.y = p.y; this.mouse.clicked = true; pendingClick = p; Sound.ensure();
      }
    });
    document.querySelectorAll('[data-control]').forEach(button => {
      const control = button.dataset.control;
      const press = e => { e.preventDefault(); Sound.ensure(); this.down.add(control); this.pressed.add(control); button.setPointerCapture?.(e.pointerId); };
      const release = e => { e.preventDefault(); this.down.delete(control); };
      button.addEventListener('pointerdown', press);
      button.addEventListener('pointerup', release);
      button.addEventListener('pointercancel', release);
      button.addEventListener('lostpointercapture', release);
    });
  },
  onKey(code) {
    if (code === 'KeyM') Sound.toggleMute();
    if (code === 'KeyP' || code === 'Escape') {
      if (Game.state === 'play') Game.state = 'pause';
      else if (Game.state === 'pause') Game.state = 'play';
    }
    if (code === 'KeyR' && ['play', 'pause', 'fail', 'win'].includes(Game.state)) { Sound.click(); Game.startRun(); }
    if (code === 'Enter') {
      if (Game.state === 'title') { Sound.click(); Game.startRun(); }
      else if (Game.state === 'fail' || Game.state === 'win') { Sound.click(); Game.startRun(); }
    }
    if (CONFIG.DEBUG) {
      if (code === 'BracketRight') Game.addScore(100, Game.dove.x, Game.dove.y - 60);
      if (code === 'BracketLeft') Game.score = Math.max(0, Game.score - 100);
      if (code === 'KeyK') Game.falcon.timer = 0.01;
      if (code === 'KeyH') {
        const g = GROVES.reduce((a, b) => Math.abs(b.cx - Game.dove.x) < Math.abs(a.cx - Game.dove.x) ? b : a);
        Game.dove.x = g.cx; Game.dove.y = CONFIG.ROW_Y[Game.dove.row]; Game.dove.state = 'ground';
      }
    }
  },
  axisX() { return (this.down.has('right') ? 1 : 0) - (this.down.has('left') ? 1 : 0); },
  consume(n) { if (this.pressed.has(n)) { this.pressed.delete(n); return true; } return false; },
  endFrame() { this.pressed.clear(); this.mouse.clicked = false; },
};
function toLogical(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * CONFIG.VIEW_W, y: (e.clientY - r.top) / r.height * CONFIG.VIEW_H };
}

/* ============================================================================
 * 5. 音效（WebAudio 程序化合成，零外部文件；M 键 / 右上角按钮静音）
 * ========================================================================== */
const Sound = {
  ctx: null, master: null, muted: false, _noiseBuf: null,
  ensure() {
    if (!this.ctx) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = this.muted ? 0 : 0.9;
        this.master.connect(this.ctx.destination);
      } catch (e) { /* 无音频环境时静默降级 */ }
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  toggleMute() { this.muted = !this.muted; if (this.master) this.master.gain.value = this.muted ? 0 : 0.9; },
  tone(o) {
    if (!this.ctx || this.muted) return;
    const t0 = this.ctx.currentTime + (o.delay || 0);
    const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f0, t0);
    if (o.f1 && o.f1 !== o.f0) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f1), t0 + o.dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(o.vol || 0.2, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);
    osc.connect(g); g.connect(this.master);
    osc.start(t0); osc.stop(t0 + o.dur + 0.05);
  },
  noise(o) {
    if (!this.ctx || this.muted) return;
    if (!this._noiseBuf) {
      const len = this.ctx.sampleRate * 0.6;
      this._noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this._noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    const t0 = this.ctx.currentTime + (o.delay || 0);
    const src = this.ctx.createBufferSource(); src.buffer = this._noiseBuf; src.loop = true;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = o.freq || 500; bp.Q.value = o.q || 1;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(o.vol || 0.2, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + o.dur + 0.05);
  },
  // 啄食声：三种食物不同音高（小米高 / 玉米中 / 花生低）
  peck(kind) {
    if (kind === 'millet') this.tone({ f0: 1650, f1: 1150, dur: 0.07, type: 'triangle', vol: 0.22 });
    else if (kind === 'corn') this.tone({ f0: 1250, f1: 880, dur: 0.09, type: 'triangle', vol: 0.24 });
    else { this.tone({ f0: 850, f1: 560, dur: 0.1, type: 'triangle', vol: 0.26 }); this.tone({ f0: 190, f1: 140, dur: 0.05, type: 'square', vol: 0.1 }); }
  },
  flap() { this.noise({ dur: 0.13, freq: 420, q: 1.2, vol: 0.22 }); this.noise({ dur: 0.1, freq: 300, q: 1, vol: 0.15, delay: 0.09 }); },
  screech() {  // 游隼尖锐啸叫（两声下滑）
    this.tone({ f0: 2100, f1: 760, dur: 0.3, type: 'sawtooth', vol: 0.13 });
    this.tone({ f0: 2450, f1: 900, dur: 0.22, type: 'sawtooth', vol: 0.11, delay: 0.34 });
    this.noise({ dur: 0.28, freq: 2600, q: 2, vol: 0.05 });
  },
  alarm() { for (let i = 0; i < 3; i++) this.tone({ f0: 940, dur: 0.09, type: 'square', vol: 0.09, delay: i * 0.19 }); },
  hop() { this.tone({ f0: 500, f1: 720, dur: 0.08, type: 'sine', vol: 0.09 }); },
  win() {
    [523, 659, 784, 1047].forEach((f, i) => this.tone({ f0: f, dur: 0.18, type: 'triangle', vol: 0.2, delay: i * 0.14 }));
    this.tone({ f0: 2093, dur: 0.45, type: 'sine', vol: 0.08, delay: 0.6 });
  },
  fail() {
    this.tone({ f0: 300, f1: 96, dur: 0.7, type: 'sawtooth', vol: 0.16 });
    this.tone({ f0: 150, f1: 58, dur: 0.5, type: 'triangle', vol: 0.22, delay: 0.05 });
    this.noise({ dur: 0.3, freq: 220, q: 0.8, vol: 0.18 });
  },
  grab() { this.noise({ dur: 0.18, freq: 900, q: 0.6, vol: 0.25 }); },
  click() { this.tone({ f0: 760, f1: 600, dur: 0.06, type: 'sine', vol: 0.15 }); },
};

/* ============================================================================
 * 6. 精灵图替换接口（预留）
 *    当前全部角色为矢量程序化绘制；以后想换图片，调用：
 *      setSprite('dove', 'img/dove.png')          // 斑鸠（任意姿态共用一图）
 *      setSprite('falcon', 'img/falcon.png')      // 游隼
 *    图片加载完成后自动替换矢量画法；删除图片引用即可回到矢量绘制。
 * ========================================================================== */
const Sprites = { dove: null, falcon: null };
function setSprite(name, url) {
  if (!Sprites.hasOwnProperty(name)) return;
  const img = new Image();
  img.onload = () => { Sprites[name] = img; };
  img.src = url;
}

/* ============================================================================
 * 7. 场景派生数据（窗位/装饰等，用确定性随机保证画面稳定）
 * ========================================================================== */
const ROW_Y = CONFIG.ROW_Y;
const BUILDINGS = CONFIG.SCENE.buildings.map((b, bi) => {
  const rng = makeRng(1000 + bi * 77);
  const span = b.x1 - b.x0;
  const cols = Math.max(2, Math.floor((span - 60) / 124));
  const startX = b.x0 + (span - (cols * 124 - 58)) / 2;
  const windows = [];
  for (let r = 0; r < 2; r++) {                       // 两排窗：下排带窗台可站立
    const bottom = ROW_Y.sill - r * 118;
    if (bottom - 80 < b.top + 14 && r === 1) break;   // 楼不够高则只有一排
    for (let c = 0; c < cols; c++) {
      windows.push({
        x: startX + c * 124, bottom,
        lit: rng() < 0.3, curtain: pickR(rng, ['#D98E8E', '#9CB8A8', '#C9A6C9', '#E0B27A']),
        sill: r === 0,
      });
    }
  }
  return { ...b, bi, windows, doorX: b.x0 + span * (0.3 + rng() * 0.4), roofBox: rng() < 0.8, roofBox2: rng() < 0.5, lampSeed: rng() };
});
function pickR(rng, arr) { return arr[Math.floor(rng() * arr.length)]; }
const GROVES = CONFIG.SCENE.groves.map((g, gi) => {
  const rng = makeRng(5000 + gi * 131);
  return {
    ...g, phase: rng() * TAU,
    x0: g.cx - g.width / 2, x1: g.cx + g.width / 2,
    trees: [{ dx: -66, s: 1 }, { dx: 44, s: 0.82 }],
    bushes: [{ dx: -118, s: 1 }, { dx: -8, s: 1.22 }, { dx: 106, s: 0.92 }],
    berries: Array.from({ length: 7 }, () => ({ dx: rand(-120, 120), dy: rand(-26, -4), })),
  };
});
// 远景/天空装饰
const DECOR = (() => {
  const rng = makeRng(20260913);
  const mkSkyline = (par, hMin, hMax, gapMin, gapMax) => {
    const arr = []; let x = -200; const need = CONFIG.WORLD_WIDTH * par + CONFIG.VIEW_W + 400;
    while (x < need) { const w = 46 + rng() * 110; arr.push({ x, w, h: hMin + rng() * (hMax - hMin), tank: rng() < 0.3 }); x += w + gapMin + rng() * gapMax; }
    return arr;
  };
  return {
    clouds: Array.from({ length: 7 }, () => ({ x: rng() * 2400, y: 36 + rng() * 150, s: 0.55 + rng() * 0.9, spd: 5 + rng() * 9 })),
    far: mkSkyline(0.15, 50, 150, 8, 30),
    mid: mkSkyline(0.3, 80, 230, 20, 60),
    lamps: [64, 480, 1160, 1960, 2780, 3220],
    tufts: Array.from({ length: 46 }, () => ({ x: rng() * CONFIG.WORLD_WIDTH, s: 0.6 + rng() * 0.8 })),
    patches: Array.from({ length: 8 }, () => ({ x: rng() * CONFIG.WORLD_WIDTH, dy: rng() * 50 })),
    manholes: [520, 1250, 1980, 2680, 3220],
  };
})();

/* ============================================================================
 * 8. 粒子与飘字
 * ========================================================================== */
const Particles = {
  list: [],
  burst(kind, x, y, n, opt = {}) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), sp = rand(30, opt.speed || 130);
      this.list.push({
        kind, x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (opt.up || 0),
        t: 0, life: opt.life || rand(0.5, 1.1), size: opt.size || rand(3, 6),
        rot: rand(0, TAU), vr: rand(-4, 4), color: opt.color || null, screen: !!opt.screen,
      });
    }
    if (this.list.length > 400) this.list.splice(0, this.list.length - 400);
  },
  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const p = this.list[i]; p.t += dt;
      if (p.t >= p.life) { this.list.splice(i, 1); continue; }
      if (p.kind === 'feather') { p.vy += 42 * dt; p.vx *= 0.99; p.x += (p.vx + Math.sin(p.t * 7 + p.rot) * 26) * dt; p.y += p.vy * dt; p.rot += p.vr * dt; }
      else if (p.kind === 'spark') { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.95; p.vy *= 0.95; }
      else if (p.kind === 'dust') { p.x += p.vx * dt; p.y += p.vy * dt * 0.4; p.vx *= 0.92; }
      else { p.x += p.vx * dt; p.y += p.vy * dt; }
    }
  },
  draw() {
    for (const p of this.list) {
      const k = 1 - p.t / p.life;
      ctx.save(); ctx.globalAlpha = Math.min(1, k * 1.4);
      if (!p.screen) ctx.translate(-Game.cam.x, 0);
      if (p.kind === 'feather') {
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.color || '#F3E4D8';
        ctx.beginPath(); ctx.ellipse(0, 0, p.size * 1.6, p.size * 0.6, 0, 0, TAU); ctx.fill();
      } else if (p.kind === 'spark') {
        ctx.fillStyle = p.color || '#FFE9A8';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * k, 0, TAU); ctx.fill();
      } else if (p.kind === 'dust') {
        ctx.fillStyle = p.color || 'rgba(180,160,130,0.7)';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1.6 - k), 0, TAU); ctx.fill();
      } else {
        ctx.fillStyle = p.color || '#FFFFFF';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * k, 0, TAU); ctx.fill();
      }
      ctx.restore();
    }
  },
};
const Floats = {
  list: [],
  add(x, y, txt, color) { this.list.push({ x, y, txt, color, t: 0 }); },
  update(dt) { for (let i = this.list.length - 1; i >= 0; i--) { const f = this.list[i]; f.t += dt; if (f.t > 1) this.list.splice(i, 1); } },
  draw() {
    for (const f of this.list) {
      ctx.save(); ctx.globalAlpha = 1 - f.t;
      txt(f.txt, f.x, f.y - f.t * 46, { size: 26, weight: 700, color: f.color, align: 'center', stroke: 'rgba(60,40,20,0.75)', strokeW: 4 });
      ctx.restore();
    }
  },
};

/* ============================================================================
 * 9. 实体类：食物 / 珠颈斑鸠 / 游隼
 * ========================================================================== */
class Food {
  constructor(kind, x, row, b = null) {
    this.kind = kind; this.x = x; this.row = row; this.b = b;
    this.baseY = ROW_Y[row]; this.age = 0; this.phase = rand(0, TAU);
    this.dropT = row === 'sill' ? 0.45 : 0.3;   // 撒落/掉落入场动画
  }
  update(dt) { this.age += dt; if (this.dropT > 0) this.dropT -= dt; }
  get dead() { return this.age >= CONFIG.FOOD.LIFE; }
}

class Dove {
  constructor() { this.reset(); }
  reset() {
    this.x = 340; this.y = ROW_Y.sidewalk; this.row = 'sidewalk'; this.building = null;
    this.facing = 1; this.state = 'ground';   // ground | flyup | drop
    this.moveT = 0; this.vx = 0; this.idleT = rand(2, 4); this.blinkT = rand(1, 3); this.blink = 0;
    this.dashT = 0; this.dashCd = 0; this.peckT = 0; this.hopT = 0; this.tailKick = 0;
    this.animT = 0; this.fly = null; this.onSillHint = false;
  }
  get centerY() { return this.y - 26; }        // 身体中心（碰撞判定用）
  get dashing() { return this.dashT > 0; }
  nearBuilding() { return BUILDINGS.findIndex(b => this.x > b.x0 - 24 && this.x < b.x1 + 24); }
  isSafe() {   // 必须完全进入树林安全带（内缩 safeMargin）
    const m = CONFIG.DOVE.safeMargin;
    return GROVES.some(g => this.x > g.x0 + m && this.x < g.x1 - m);
  }
  startFly(bi) {
    const b = BUILDINGS[bi];
    this.state = 'flyup'; this.building = bi;
    const tx = clamp(this.x, b.x0 + 30, b.x1 - 30);
    this.fly = { t: 0, x0: this.x, y0: this.y, x1: tx, y1: ROW_Y.sill, dur: CONFIG.DOVE.flyTime };
    this.facing = tx >= this.x ? 1 : -1;
    Sound.flap();
    Particles.burst('dust', this.x, this.y, 4, { size: 3, life: 0.4 });
  }
  startDrop() {
    this.state = 'drop';
    this.fly = { t: 0, x0: this.x, y0: this.y, x1: this.x + this.facing * 14, y1: ROW_Y.sidewalk, dur: CONFIG.DOVE.dropTime };
    Sound.flap();
  }
  startDash() {
    this.dashT = CONFIG.DOVE.dashTime; this.dashCd = CONFIG.DOVE.dashCd;
    Sound.flap();
    Particles.burst('dust', this.x, this.y, 5, { size: 3.5, life: 0.45 });
  }
  switchRow(to) {
    this.row = to; this.y = ROW_Y[to]; this.hopT = 0.18;
    Sound.hop();
    Particles.burst('dust', this.x, this.y, 3, { size: 2.6, life: 0.35 });
  }
  update(dt) {
    this.animT += dt;
    if (this.dashCd > 0) this.dashCd -= dt;
    if (this.dashT > 0) this.dashT -= dt;
    if (this.peckT > 0) this.peckT -= dt;
    if (this.hopT > 0) this.hopT -= dt;
    if (this.tailKick > 0) this.tailKick -= dt;
    this.blinkT -= dt;
    if (this.blinkT <= 0) { this.blink = 0.14; this.blinkT = rand(2, 4.5); }
    if (this.blink > 0) this.blink -= dt;
    this.idleT -= dt;
    if (this.idleT <= 0) { this.tailKick = 0.5; this.idleT = rand(2.5, 5); }

    if (this.state === 'ground') {
      const ax = Input.axisX();
      const spd = CONFIG.DOVE.speed * (this.dashing ? CONFIG.DOVE.dashMul : 1);
      this.vx = ax * spd;
      if (ax !== 0) {
        this.facing = ax;
        this.x += this.vx * dt;
        this.moveT += dt * (this.dashing ? 1.6 : 1);
      } else this.vx = 0;
      this.x = clamp(this.x, 46, CONFIG.WORLD_WIDTH - 46);
      if (this.row === 'sill' && this.building != null) {
        const b = BUILDINGS[this.building];
        this.x = clamp(this.x, b.x0 + 28, b.x1 - 28);
      }
      // 上下切换层
      if (Input.consume('up')) {
        if (this.row === 'street') this.switchRow('sidewalk');
        else if (this.row === 'sidewalk') {
          const bi = this.nearBuilding();
          if (bi >= 0) this.startFly(bi);
        }
      }
      if (Input.consume('down')) {
        if (this.row === 'sill') this.startDrop();
        else if (this.row === 'sidewalk') this.switchRow('street');
      }
      // 空格：靠近楼体=扑翼飞上窗台；否则短扑翼加速（窗台上也可加速逃生）
      if (Input.consume('jump')) {
        if (this.row !== 'sill') {
          const bi = this.nearBuilding();
          if (bi >= 0) this.startFly(bi);
          else if (this.dashCd <= 0) this.startDash();
        } else if (this.dashCd <= 0) this.startDash();
      }
      Game.tryEat();
    } else if (this.state === 'flyup' || this.state === 'drop') {
      const f = this.fly; f.t += dt;
      const k = clamp(f.t / f.dur, 0, 1);
      const e = this.state === 'flyup' ? easeOut(k) : easeIn(k);
      this.x = lerp(f.x0, f.x1, k);
      this.y = lerp(f.y0, f.y1, e);
      if (k >= 1) {
        if (this.state === 'flyup') { this.row = 'sill'; this.y = ROW_Y.sill; this.onSillHint = true; }
        else { this.row = 'sidewalk'; this.y = ROW_Y.sidewalk; this.building = null; }
        this.state = 'ground';
        Particles.burst('dust', this.x, this.y, 4, { size: 3, life: 0.4 });
        Game.tryEat();
      }
    }
  }
  render() {
    const moving = this.vx !== 0 || this.state !== 'ground';
    let mode = 'idle';
    if (this.state === 'flyup') mode = 'fly';
    else if (this.state === 'drop') mode = 'drop';
    else if (this.dashing) mode = 'dash';
    else if (this.vx !== 0) mode = 'walk';
    const hop = this.hopT > 0 ? Math.sin((1 - this.hopT / 0.18) * Math.PI) * 12 : 0;
    drawDoveShadow(this.x, this.y);
    const safe = this.isSafe();
    drawDove({
      x: this.x, y: this.y - hop, facing: this.facing, t: this.animT, mode,
      phase: this.moveT * (this.dashing ? 13 : 9.5),
      peck01: this.peckT > 0 ? Math.sin((1 - this.peckT / 0.28) * Math.PI) : 0,
      blink01: this.blink > 0 ? 1 : 0, tailKick: this.tailKick, alpha: safe ? 0.92 : 1,
    });
    if (safe) drawSafeBadge(this.x, this.y - 96);
  }
}

class Falcon {
  constructor() { this.reset(); }
  reset() {
    this.state = 'hidden'; this.x = -999; this.y = -300; this.vx = 0; this.vy = 0;
    this.timer = CONFIG.FALCON.safeTime; this.animT = 0; this.t = 0;
    this.side = 1; this.patrolT = 0; this.diveT = 0; this.exitT = 0; this.visits = 0;
    this.target = null; this.shadowX = 0;
  }
  get active() { return ['enter', 'patrol', 'dive', 'exit'].includes(this.state); }
  talon() {
    const ang = Math.atan2(this.vy, this.vx || this.side);
    return { x: this.x + Math.cos(ang) * 46, y: this.y + Math.sin(ang) * 46, ang };
  }
  startWarning() {
    this.state = 'warning'; this.t = 0;
    this.side = Math.random() < 0.5 ? -1 : 1;
    this.enterX = Game.cam.x + (this.side < 0 ? -160 : CONFIG.VIEW_W + 160);
    Sound.screech(); Sound.alarm();
  }
  startDive() {
    this.state = 'dive'; this.diveT = 0;
    const d = Game.dove;
    const ang = Math.atan2(d.centerY - this.y, d.x - this.x);
    this.vx = Math.cos(ang) * CONFIG.FALCON.diveSpeed * 0.66;
    this.vy = Math.sin(ang) * CONFIG.FALCON.diveSpeed * 0.66;
  }
  update(dt) {
    this.animT += dt; this.t += dt;
    const F = CONFIG.FALCON, d = Game.dove;
    switch (this.state) {
      case 'hidden':
        this.timer -= dt;
        if (this.timer <= 0 && Game.state === 'play') this.startWarning();
        break;
      case 'warning': {
        this.timer -= dt;
        const k = 1 - this.timer / F.warnTime;
        this.shadowX = lerp(this.enterX + this.side * -260, this.enterX + this.side * -260 + this.side * -900, k);
        if (this.timer <= 0) {
          this.state = 'enter'; this.t = 0;
          this.x = this.enterX; this.y = 195;
          this.target = { x: d.x + rand(-70, 70), y: 295 };
          this.ex = this.x; this.ey = this.y;
        }
        break;
      }
      case 'enter': {
        const k = clamp(this.t / F.enterTime, 0, 1);
        const e = easeInOut(k);
        const px = this.x, py = this.y;
        this.x = lerp(this.ex, this.target.x, e);
        this.y = lerp(this.ey, this.target.y, e);
        this.vx = (this.x - px) / Math.max(dt, 1e-4); this.vy = (this.y - py) / Math.max(dt, 1e-4);
        if (k >= 1) {
          this.state = 'patrol'; this.patrolT = rand(F.patrolTimeMin, F.patrolTimeMax);
          this.vx = (d.x >= this.x ? 1 : -1) * F.glideSpeed; this.vy = 0;
        }
        break;
      }
      case 'patrol': {
        // 在街道与楼房间滑翔巡航， loosely 追着斑鸠的横向位置
        const want = Math.sign(d.x - this.x) * F.glideSpeed;
        this.vx += clamp(want - this.vx, -240 * dt, 240 * dt);
        this.x += this.vx * dt;
        this.y += ((300 + Math.sin(this.animT * 1.9) * 26) - this.y) * Math.min(1, 2.4 * dt);
        this.vy = Math.cos(this.animT * 1.9) * 30;
        const lo = Game.cam.x + 70, hi = Game.cam.x + CONFIG.VIEW_W - 70;
        if (this.x < lo) this.vx = Math.abs(this.vx); else if (this.x > hi) this.vx = -Math.abs(this.vx);
        this.patrolT -= dt;
        if (this.patrolT <= 0) this.startDive();
        break;
      }
      case 'dive': {
        this.diveT += dt;
        // 带惯性的转向：速度渐近目标方向，不能瞬瞄
        const tx = d.x + d.vx * 0.22, ty = d.centerY;
        const ang = Math.atan2(ty - this.y, tx - this.x);
        const dvx = Math.cos(ang) * F.diveSpeed, dvy = Math.sin(ang) * F.diveSpeed;
        const s = Math.min(1, F.steerRate * dt);
        this.vx += (dvx - this.vx) * s; this.vy += (dvy - this.vy) * s;
        this.x += this.vx * dt; this.y += this.vy * dt;
        // 斑鸠已进树林 → 立即放弃俯冲拉起离场（树林里绝对不会被抓）
        if (d.isSafe()) { this.state = 'exit'; this.exitT = 0; break; }
        if (this.y > ROW_Y.street - 8 || this.diveT > 2.4) { this.state = 'exit'; this.exitT = 0; }
        break;
      }
      case 'exit': {
        this.exitT += dt;
        const dir = this.vx !== 0 ? Math.sign(this.vx) : this.side;
        this.vx += (dir * F.glideSpeed * 1.1 - this.vx) * Math.min(1, 3 * dt);
        this.vy += (-190 - this.vy) * Math.min(1, 2.6 * dt);
        this.x += this.vx * dt; this.y += this.vy * dt;
        if (this.x < Game.cam.x - 240 || this.x > Game.cam.x + CONFIG.VIEW_W + 240 || this.exitT > 3.2) {
          this.state = 'hidden'; this.visits++;
          this.timer = rand(F.gapMin, F.gapMax);
        }
        break;
      }
      case 'catch': {
        // 抓住斑鸠后带离上升（失败动画由 Game 驱动）
        this.vy = -230; this.vx = (this.vx || 60) * 0.98 + 30 * dt;
        this.y += this.vy * dt; this.x += this.vx * dt;
        break;
      }
    }
  }
  render() {
    let mode = 'glide';
    if (this.state === 'enter') mode = 'flap';
    else if (this.state === 'dive') mode = 'dive';
    else if (this.state === 'catch') mode = 'catch';
    else if (this.state === 'exit') mode = 'flap';
    const ang = Math.atan2(this.vy, this.vx || this.side);
    // 地面投影（游隼越高影子越大越淡）
    const alt = clamp((ROW_Y.street - 60 - this.y) / 420, 0, 1);
    ctx.save();
    ctx.globalAlpha = 0.24 * (1 - alt * 0.55);
    ctx.fillStyle = '#26303A';
    ctx.beginPath(); ctx.ellipse(this.x, ROW_Y.street + 8, 62 * (1 - alt * 0.35), 12, 0, 0, TAU); ctx.fill();
    ctx.restore();
    drawFalcon({ x: this.x, y: this.y, ang, mode, t: this.animT });
  }
}

/* ============================================================================
 * 10. 食物生成器（两个来源 + 三档难度权重）
 * ========================================================================== */
const Spawner = {
  sillT: 0.8, streetT: 2.5,
  reset() { this.sillT = 0.8; this.streetT = 2.5; },
  tier(score) {
    let t = CONFIG.FOOD.TIERS[0];
    for (const x of CONFIG.FOOD.TIERS) if (score >= x.minScore) t = x;
    return t;
  },
  tierIndex(score) { return CONFIG.FOOD.TIERS.indexOf(this.tier(score)); },
  pickKind(tier) {
    const w = tier.weights, total = w.millet + w.corn + w.peanut;
    let r = Math.random() * total;
    for (const k of ['millet', 'corn', 'peanut']) { r -= w[k]; if (r <= 0) return k; }
    return 'millet';
  },
  update(dt, game) {
    const tier = this.tier(game.score);
    this.sillT -= dt * tier.rateMul;
    if (this.sillT <= 0) { this.sillT += CONFIG.FOOD.sillInterval; this.spawn('sill', game); }
    this.streetT -= dt * tier.rateMul;
    if (this.streetT <= 0) { this.streetT += CONFIG.FOOD.streetInterval; this.spawn('street', game); }
  },
  spawn(src, game) {
    const cap = CONFIG.FOOD.CAP;
    if (game.foods.length >= cap) return;
    const range = src === 'sill' ? CONFIG.FOOD.sillCluster : CONFIG.FOOD.streetCluster;
    let n = Math.min(randInt(range[0], range[1]), cap - game.foods.length);
    if (n <= 0) return;
    const tier = this.tier(game.score);
    if (src === 'sill') {
      // 只在镜头附近的楼上撒（保证刷在玩家周围）
      const lo = game.cam.x - 260, hi = game.cam.x + CONFIG.VIEW_W + 260;
      const cands = BUILDINGS.filter(b => b.x1 > lo && b.x0 < hi);
      const b = cands.length ? pick(cands) : BUILDINGS[0];
      const cx = rand(b.x0 + 70, b.x1 - 70);
      for (let k = 0; k < n; k++) {
        game.foods.push(new Food(this.pickKind(tier), clamp(cx + rand(-54, 54), b.x0 + 34, b.x1 - 34), 'sill', b.bi));
      }
      Particles.burst('pop', cx, ROW_Y.sill - 46, 4, { size: 2.5, life: 0.5, color: '#FFF2C8' });
    } else {
      const row = Math.random() < 0.6 ? 'street' : 'sidewalk';
      const cx = clamp(game.cam.x + rand(60, CONFIG.VIEW_W - 60), 70, CONFIG.WORLD_WIDTH - 70);
      for (let k = 0; k < n; k++) {
        game.foods.push(new Food(this.pickKind(tier), clamp(cx + rand(-42, 42), 60, CONFIG.WORLD_WIDTH - 60), row, null));
      }
    }
  },
};

/* ============================================================================
 * 11. 游戏状态机与碰撞判定
 * ========================================================================== */
const Game = {
  state: 'title',   // title | play | pause | caught | fail | winAnim | win
  score: 0, time: 0, playT: 0, threatT: 0,
  foods: [], dove: new Dove(), falcon: new Falcon(),
  cam: { x: 0 }, shake: 0, caughtT: 0, winT: 0, flash: 0,
  eaten: { millet: 0, corn: 0, peanut: 0 },
  hintSillShown: false,

  startRun() {
    this.score = 0; this.foods = []; this.eaten = { millet: 0, corn: 0, peanut: 0 };
    this.dove.reset(); this.falcon.reset(); Spawner.reset(); Particles.list = []; Floats.list = [];
    this.playT = 0; this.threatT = 0; this.shake = 0; this.caughtT = 0; this.winT = 0; this.flash = 0;
    this.hintSillShown = false;
    this.state = 'play';
  },
  addScore(v, x, y) {
    this.score += v;
    Floats.add(x, y - 20, '+' + v, v >= 3 ? '#FF8D5C' : v === 2 ? '#F5B93E' : '#F7E7A1');
    if (this.score >= CONFIG.GOAL_SCORE && this.state === 'play') {
      this.state = 'winAnim'; this.winT = 0; Sound.win();
      Particles.burst('spark', x, y, 26, { size: 4, life: 1.2, speed: 200, color: '#FFEDB0' });
    }
  },
  tryEat() {
    if (this.dove.state !== 'ground') return;
    for (let i = this.foods.length - 1; i >= 0; i--) {
      const f = this.foods[i];
      if (f.row !== this.dove.row) continue;
      if (f.row === 'sill' && f.b !== this.dove.building) continue;
      if (Math.abs(f.x - this.dove.x) <= CONFIG.DOVE.eatRange) {
        this.foods.splice(i, 1);
        const info = CONFIG.FOOD.INFO[f.kind];
        this.dove.peckT = 0.28;
        this.eaten[f.kind]++;
        Sound.peck(f.kind);
        Particles.burst('pop', f.x, f.baseY - 16, 5, { size: 2.4, life: 0.45, color: '#FFE9A8' });
        this.addScore(info.score, f.x, f.baseY);
      }
    }
  },
  onCaught() {
    if (this.state !== 'play') return;
    this.state = 'caught'; this.caughtT = 0; this.shake = 16; this.flash = 0.5;
    this.falcon.state = 'catch';
    Sound.fail(); Sound.grab();
    const d = this.dove;
    for (let i = 0; i < 14; i++) Particles.burst('feather', d.x + rand(-16, 16), d.centerY + rand(-14, 14), 1, { size: rand(3, 6), life: rand(0.8, 1.5) });
  },
  onButton(id) {
    switch (id) {
      case 'start': case 'restart': case 'winAgain': Sound.click(); this.startRun(); break;
      case 'menu': Sound.click(); this.state = 'title'; break;
      case 'mute': Sound.toggleMute(); break;
      case 'pause':
        Sound.click();
        if (this.state === 'play') this.state = 'pause';
        else if (this.state === 'pause') this.state = 'play';
        break;
    }
  },
  update(dt) {
    this.time += dt;
    if (this.flash > 0) this.flash -= dt;
    Particles.update(dt); Floats.update(dt);
    if (this.shake > 0) this.shake = Math.max(0, this.shake - 40 * dt);

    if (this.state === 'title') {
      this.cam.x = clamp(880 + Math.sin(this.time * 0.09) * 880, 0, CONFIG.WORLD_WIDTH - CONFIG.VIEW_W);
      return;
    }
    if (this.state === 'pause' || this.state === 'fail') return;

    if (this.state === 'play') {
      this.playT += dt;
      if (this.falcon.active || this.falcon.state === 'warning') this.threatT += dt;
      this.dove.update(dt);
      Spawner.update(dt, this);
      for (let i = this.foods.length - 1; i >= 0; i--) {
        const f = this.foods[i]; f.update(dt);
        if (f.dead) this.foods.splice(i, 1);
      }
      this.falcon.update(dt);
      // 碰撞判定：隼爪范围与斑鸠身体重叠 && 斑鸠不在树林安全区
      if (this.falcon.state === 'dive' && !this.dove.isSafe()) {
        const tal = this.falcon.talon();
        const dx = tal.x - this.dove.x, dy = tal.y - this.dove.centerY;
        if (dx * dx + dy * dy < CONFIG.FALCON.catchRadius * CONFIG.FALCON.catchRadius) this.onCaught();
      }
      // 镜头跟随
      const tx = clamp(this.dove.x - CONFIG.VIEW_W / 2, 0, CONFIG.WORLD_WIDTH - CONFIG.VIEW_W);
      this.cam.x += (tx - this.cam.x) * Math.min(1, 5 * dt);
    } else if (this.state === 'caught') {
      this.caughtT += dt;
      this.falcon.update(dt);
      if (Math.random() < 0.3) Particles.burst('feather', this.falcon.x, this.falcon.y + 30, 1, { size: rand(2.5, 5), life: rand(0.7, 1.2) });
      if (this.caughtT > 1.7) this.state = 'fail';
    } else if (this.state === 'winAnim' || this.state === 'win') {
      this.winT += dt;
      if (Math.random() < 0.4) Particles.burst('spark', rand(0, CONFIG.VIEW_W), rand(80, 560), 1, { size: rand(1.5, 3.5), life: rand(0.6, 1.3), screen: true, color: '#FFE9A8' });
      if (this.state === 'winAnim' && this.winT > 4.4) this.state = 'win';
    }

}

let uiButtons = [], pendingClick = null, hoverPointer = false;
function button(id, x, y, w, h, label, o = {}) {
  const hov = Input.mouse.x >= x && Input.mouse.x <= x + w && Input.mouse.y >= y && Input.mouse.y <= y + h;
  if (hov) hoverPointer = true;
  ctx.save();

  else { g.addColorStop(0, hov ? '#E8E0D4' : '#DCD2C4'); g.addColorStop(1, hov ? '#CFC4B4' : '#C4B8A6'); }
  ctx.fillStyle = g; ctx.fill();

    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { Game.onButton(b.id); return; }
  }
}

  rr(bx2, 14, 46, 40, 10); ctx.fillStyle = 'rgba(255,250,240,0.9)'; ctx.fill();
  ctx.strokeStyle = 'rgba(90,60,30,0.35)'; ctx.stroke();
  drawIconSpeaker(bx2 + 20, 34, Sound.muted);
  rr(bx2 + 56, 14, 46, 40, 10); ctx.fillStyle = 'rgba(255,250,240,0.9)'; ctx.fill();
  ctx.strokeStyle = 'rgba(90,60,30,0.35)'; ctx.stroke();
  drawIconPause(bx2 + 79, 34);
  uiButtons.push({ id: 'mute', x: bx2, y: 14, w: 46, h: 40 }, { id: 'pause', x: bx2 + 56, y: 14, w: 46, h: 40 });
  if (Input.mouse.x >= bx2 && Input.mouse.x <= bx2 + 46 && Input.mouse.y >= 14 && Input.mouse.y <= 54) hoverPointer = true;
  if (Input.mouse.x >= bx2 + 56 && Input.mouse.x <= bx2 + 102 && Input.mouse.y >= 14 && Input.mouse.y <= 54) hoverPointer = true;
  // ---- 游隼状态提示 ----
  if (Game.falcon.state === 'warning') {
    // 屏幕边缘红色警示框（脉冲）
    const a = 0.35 + 0.3 * Math.abs(Math.sin(Game.time * 10));
    ctx.save(); ctx.strokeStyle = `rgba(220,60,40,${a})`; ctx.lineWidth = 10;
    ctx.strokeRect(5, 5, CONFIG.VIEW_W - 10, CONFIG.VIEW_H - 10);
    ctx.restore();
    // 横幅
    const bwid = 470, bx3 = (CONFIG.VIEW_W - bwid) / 2;
    ctx.save();
    ctx.translate(CONFIG.VIEW_W / 2, 96 + Math.sin(Game.time * 18) * 2);
    const bg = ctx.createLinearGradient(0, -30, 0, 22);
    bg.addColorStop(0, '#E8543C'); bg.addColorStop(1, '#B83424');
    rr(-bwid / 2, -28, bwid, 50, 14); ctx.fillStyle = bg; ctx.fill();
    ctx.strokeStyle = 'rgba(255,220,200,0.8)'; ctx.lineWidth = 2; ctx.stroke();
    // 警示三角
    ctx.fillStyle = '#FFE9B0';
    ctx.beginPath(); ctx.moveTo(-bwid / 2 + 26, 10); ctx.lineTo(-bwid / 2 + 40, -14); ctx.lineTo(-bwid / 2 + 54, 10); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#B83424'; ctx.fillRect(-bwid / 2 + 38.6, -8, 2.8, 10); ctx.beginPath(); ctx.arc(-bwid / 2 + 40, 5.4, 1.5, 0, TAU); ctx.fill();
    txt('游隼来袭！快躲进树林！', 24, 9, { size: 26, weight: 800, color: '#FFF6E8', align: 'center', stroke: 'rgba(90,20,10,0.5)', strokeW: 4 });
    ctx.restore();
  } else if (Game.falcon.active) {
    ctx.save();
    rr(CONFIG.VIEW_W / 2 - 96, 24, 192, 40, 20);
    ctx.fillStyle = 'rgba(180,50,36,0.85)'; ctx.fill();
    txt('游隼在场！', CONFIG.VIEW_W / 2, 51, { size: 21, weight: 700, color: '#FFF0E4', align: 'center' });
    ctx.restore();
  }
  // ---- 底部按键提示 ----
  const hint = '←→/AD 移动   ↑↓/WS 换层·上下窗台   空格 扑翼加速   P 暂停   M 静音';
  ctx.save(); ctx.globalAlpha = 0.72;
  const hw = 760;
  rr((CONFIG.VIEW_W - hw) / 2, CONFIG.VIEW_H - 44, hw, 32, 16);
  ctx.fillStyle = 'rgba(50,36,24,0.55)'; ctx.fill();
  txt(hint, CONFIG.VIEW_W / 2, CONFIG.VIEW_H - 21, { size: 16, color: '#F5EAD8', align: 'center' });
  ctx.restore();
  // 窗台首次提示
  if (Game.dove.onSillHint && Game.dove.row === 'sill' && Game.playT < 90 && !Game.hintSillShown) {
    txt('按 ↓/S 跳回地面 · 窗台不安全！', Game.dove.x - Game.cam.x, ROW_Y.sill - 92, { size: 17, weight: 700, align: 'center', color: '#B8542C', stroke: 'rgba(255,248,230,0.9)', strokeW: 4 });
    if (Game.dove.row !== 'sill') Game.hintSillShown = true;
  }
  if (CONFIG.DEBUG) {
    txt(`DEBUG 状态:${Game.state} 隼:${Game.falcon.state} 威胁占比:${(Game.threatT / Math.max(Game.playT, 1) * 100).toFixed(0)}% 食物:${Game.foods.length} 安全:${Game.dove.isSafe()}`, 16, 150, { size: 14, color: '#2E5E2E', weight: 700 });
  }
}
function drawWarningShadow() {   // 预警期地面移动阴影
  const f = Game.falcon;
  if (f.state !== 'warning') return;
  ctx.save(); ctx.translate(-Game.cam.x, 0);
  ctx.globalAlpha = 0.22;
  ctx.fillStyle = '#1E2830';
  ctx.beginPath(); ctx.ellipse(f.shadowX, ROW_Y.street + 6, 150, 26, 0, 0, TAU); ctx.fill();
  ctx.globalAlpha = 0.13;
  ctx.beginPath(); ctx.ellipse(f.shadowX, ROW_Y.street + 6, 220, 36, 0, 0, TAU); ctx.fill();
  ctx.restore();
}
function drawTitle() {
  // 半透明底卡
  ctx.save();
  ctx.fillStyle = 'rgba(46,30,18,0.42)'; ctx.fillRect(0, 0, CONFIG.VIEW_W, CONFIG.VIEW_H);
  // 标题
  txt('珠颈斑鸠', CONFIG.VIEW_W / 2, 128, { size: 76, weight: 900, align: 'center', color: '#FFF6E2', stroke: '#5A3418', strokeW: 10 });
  txt('街区历险记', CONFIG.VIEW_W / 2, 216, { size: 76, weight: 900, align: 'center', color: '#FFE2B8', stroke: '#5A3418', strokeW: 10 });
  txt('吃到 1000 分 · 长大成城市斑鸠', CONFIG.VIEW_W / 2, 258, { size: 23, align: 'center', color: '#F7E8CE', stroke: 'rgba(70,40,20,0.6)', strokeW: 4 });

  // 左卡：斑鸠展示（插画式，轻微待机动画）
  panel(150, 320, 300, 250, { fill: 'rgba(255,250,240,0.96)', stroke: '#D9BE8E' });
  drawDoveShadow(300, 530);
  drawDove({ x: 300, y: 530, facing: 1, t: Game.time, mode: 'idle', phase: Game.time * 2, scale: 1.9 });
  txt('珠颈斑鸠（你）', 300, 348, { size: 20, weight: 700, align: 'center', color: '#7A4A22' });
  txt('颈戴“珍珠项链” · 温顺觅食', 300, 556, { size: 15, align: 'center', color: '#A07850' });

  // 右卡：游隼展示（滑翔姿态上下轻浮）
  panel(830, 320, 300, 250, { fill: 'rgba(240,244,250,0.96)', stroke: '#AEBBD1' });
  drawFalcon({ x: 980, y: 438 + Math.sin(Game.time * 1.6) * 10, ang: Math.sin(Game.time * 0.9) * 0.12 - 0.05, mode: 'glide', t: Game.time });
  txt('游隼（天敌）', 980, 348, { size: 20, weight: 700, align: 'center', color: '#3E4A5C' });
  txt('黑头盔 · 髭纹 · 高速俯冲', 980, 556, { size: 15, align: 'center', color: '#6A7A8E' });

  // 中卡：玩法说明
  panel(478, 312, 324, 268, { fill: 'rgba(255,252,244,0.96)', stroke: '#D9BE8E' });
  txt('怎么玩', 640, 342, { size: 20, weight: 800, align: 'center', color: '#7A4A22' });
  const lines = [
    '· 吃食物攒分：小米+1 玉米+2 花生+3',
    '· 窗台常有人撒粮（主来源），路上偶有掉落',
    '· 积满 1000 分通关，飞向城市！',
    '· 红色预警 = 游隼要来了，',
    '   快跑进树林/灌木丛（绿光安全区）',
    '· 窗台不安全；空格扑翼加速可逃生',
  ];
  lines.forEach((l, i) => txt(l, 496, 376 + i * 27, { size: 16, color: '#5A4634' }));
  txt('↑↓ 在 街道/人行道/窗台 间移动', 496, 376 + 6 * 27, { size: 16, color: '#8A6A48' });

  button('start', CONFIG.VIEW_W / 2 - 130, 610, 260, 62, '开 始 游 戏', { size: 28 });
  txt('P 暂停 · M 静音 · R 重开 · 矢量绘制 / WebAudio 合成 · 零外部素材', CONFIG.VIEW_W / 2, 700, { size: 14, align: 'center', color: 'rgba(255,240,220,0.75)' });
  ctx.restore();
}
function drawFailOverlay() {
  ctx.save();
  ctx.fillStyle = 'rgba(40,16,10,0.55)'; ctx.fillRect(0, 0, CONFIG.VIEW_W, CONFIG.VIEW_H);
  panel(CONFIG.VIEW_W / 2 - 290, 190, 580, 320, { fill: 'rgba(255,246,238,0.97)', stroke: '#D89A80' });
  txt('被游隼吃掉了…', CONFIG.VIEW_W / 2, 268, { size: 46, weight: 900, align: 'center', color: '#B83424' });
  txt(`本局积分  ${Game.score} / ${CONFIG.GOAL_SCORE}`, CONFIG.VIEW_W / 2, 322, { size: 26, weight: 700, align: 'center', color: '#5A4634' });
  const diff = CONFIG.GOAL_SCORE - Game.score;
  txt(diff > 0 ? `再攒 ${diff} 分就能通关，再试一次！` : '差一点点就通关了！', CONFIG.VIEW_W / 2, 356, { size: 17, align: 'center', color: '#A07850' });
  const e = Game.eaten;
  txt(`吃下 小米×${e.millet} · 玉米×${e.corn} · 花生米×${e.peanut}`, CONFIG.VIEW_W / 2, 392, { size: 16, align: 'center', color: '#8A6A48' });
  button('restart', CONFIG.VIEW_W / 2 - 232, 424, 220, 56, '重新开始 (R)', { size: 22 });
  button('menu', CONFIG.VIEW_W / 2 + 12, 424, 220, 56, '回主菜单', { style: 'ghost', size: 22 });
  txt('提示：听到啸叫就往最近的树林跑，绿色光圈里绝对安全', CONFIG.VIEW_W / 2, 494, { size: 15, align: 'center', color: '#B8542C' });
  ctx.restore();
}
function drawPauseOverlay() {
  ctx.save();
  ctx.fillStyle = 'rgba(30,24,18,0.5)'; ctx.fillRect(0, 0, CONFIG.VIEW_W, CONFIG.VIEW_H);
  txt('已暂停', CONFIG.VIEW_W / 2, 330, { size: 54, weight: 900, align: 'center', color: '#FFF6E2', stroke: 'rgba(60,40,20,0.8)', strokeW: 8 });
  button('pause', CONFIG.VIEW_W / 2 - 110, 380, 220, 54, '继 续 (P)', { size: 22 });
  ctx.restore();
}
function drawWinScene() {
  const t = Game.winT;
  // 天空（金色暖阳）
  const g = ctx.createLinearGradient(0, 0, 0, CONFIG.VIEW_H);
  g.addColorStop(0, '#8FC6E8'); g.addColorStop(0.5, '#F2DFAE'); g.addColorStop(1, '#F8CE8E');
  ctx.fillStyle = g; ctx.fillRect(0, 0, CONFIG.VIEW_W, CONFIG.VIEW_H);
  const sg = ctx.createRadialGradient(1000, 200, 20, 1000, 200, 260);
  sg.addColorStop(0, 'rgba(255,248,220,0.95)'); sg.addColorStop(1, 'rgba(255,240,200,0)');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(1000, 200, 260, 0, TAU); ctx.fill();
  for (const c of DECOR.clouds) drawCloud(((c.x + t * c.spd * 0.6) % (CONFIG.VIEW_W + 400)) - 200, c.y + 60, c.s * 1.2);
  // 远处城市天际线（逐渐放大 = 斑鸠飞向城市）
  const grow = lerp(0.55, 1.3, clamp(t / 4.5, 0, 1));
  ctx.save();
  ctx.translate(CONFIG.VIEW_W * 0.72, 560);
  ctx.scale(grow, grow);
  ctx.fillStyle = 'rgba(120,130,160,0.75)';
  for (const b of DECOR.mid) ctx.fillRect(b.x * 0.55 - 900, -b.h, b.w * 0.8, b.h);
  ctx.fillStyle = 'rgba(90,100,130,0.85)';
  ctx.fillRect(-900, -60, 2200, 80);
  ctx.restore();
  // 斑鸠沿贝塞尔飞向天际线（体型略大、羽毛更亮）
  const k = easeInOut(clamp(t / 4.2, 0, 1));
  const px = lerp(lerp(200, 520, k), 880, k * k);
  const py = lerp(lerp(580, 380, k), 250, k * k) + Math.sin(t * 3) * 8;
  const scl = lerp(1.15, 0.55, k);
  drawDove({ x: px, y: py, facing: 1, t, mode: 'win', scale: scl, fancy: true });
  Particles.draw();
  txt('通关！珠颈斑鸠长大了，飞向城市！', CONFIG.VIEW_W / 2, 96, { size: 38, weight: 900, align: 'center', color: '#FFF8E8', stroke: '#8A5A20', strokeW: 7, alpha: clamp(t / 1.2, 0, 1) });
  if (t < 0.8) { ctx.fillStyle = `rgba(255,250,230,${0.8 * (1 - t / 0.8)})`; ctx.fillRect(0, 0, CONFIG.VIEW_W, CONFIG.VIEW_H); }
  if (Game.state === 'win') {
    panel(CONFIG.VIEW_W / 2 - 280, 560, 560, 128, { fill: 'rgba(255,250,240,0.96)', stroke: '#E0C48E' });
    txt(`总积分 ${Game.score} · 用时 ${Math.floor(Game.playT / 60)}分${Math.floor(Game.playT % 60)}秒`, CONFIG.VIEW_W / 2, 598, { size: 22, weight: 700, align: 'center', color: '#5A4634' });
    const e = Game.eaten;
    txt(`共吃下 小米×${e.millet} · 玉米×${e.corn} · 花生米×${e.peanut}`, CONFIG.VIEW_W / 2, 628, { size: 16, align: 'center', color: '#8A6A48' });
    button('winAgain', CONFIG.VIEW_W / 2 - 130, 640, 130, 40, '再玩一次', { size: 18 });
    button('menu', CONFIG.VIEW_W / 2 + 6, 640, 124, 40, '主菜单', { style: 'ghost', size: 18 });
  }
}

/* ============================================================================
 * 18. 渲染总装
 * ========================================================================== */
function render() {
  uiButtons = []; hoverPointer = false;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, CONFIG.VIEW_W, CONFIG.VIEW_H);

  if (Game.state === 'winAnim' || Game.state === 'win') {
    drawWinScene();
  } else {
    // ---- 世界（横向卷轴）----
    ctx.save();
    if (Game.shake > 0) ctx.translate(rand(-Game.shake, Game.shake) * 0.4, rand(-Game.shake, Game.shake) * 0.4);
    drawSky();
    drawSkyline();
    ctx.save(); ctx.translate(-Game.cam.x, 0);
    drawGround();
    for (const l of DECOR.lamps) drawLamp(l);
    for (const b of BUILDINGS) drawBuilding(b);
    for (const g of GROVES) drawGroveBack(g);
    drawSafeZones();
    drawWarningShadow();
    drawFoods();
    if (Game.state !== 'title') {
      if (Game.state === 'caught') {
        // 斑鸠被抓住，挂在隼爪上
        const tal = Game.falcon.talon();
        drawDove({ x: tal.x, y: tal.y + 20, facing: -1, t: Game.time, mode: 'drop', rot: 0.5, alpha: 1 });
      } else {
        Game.dove.render();
      }
    }
    for (const g of GROVES) drawGroveFront(g);
    if (Game.falcon.active || Game.falcon.state === 'catch') Game.falcon.render();
    Floats.draw();
    ctx.restore();
    Particles.draw();
    // 顶部暖光
    const lg = ctx.createLinearGradient(0, 0, 0, 300);
    lg.addColorStop(0, 'rgba(255,240,200,0.16)'); lg.addColorStop(1, 'rgba(255,240,200,0)');
    ctx.fillStyle = lg; ctx.fillRect(0, 0, CONFIG.VIEW_W, 300);
    if (Game.flash > 0) { ctx.fillStyle = `rgba(200,40,20,${Game.flash * 0.5})`; ctx.fillRect(0, 0, CONFIG.VIEW_W, CONFIG.VIEW_H); }
    ctx.restore();

    // ---- 界面层 ----
    if (Game.state === 'title') drawTitle();
    else if (Game.state === 'pause') { drawHUD(); drawPauseOverlay(); }
    else if (Game.state === 'fail') drawFailOverlay();
    else drawHUD();
  }
  canvas.style.cursor = hoverPointer ? 'pointer' : 'default';
}

/* ============================================================================
 * 19. 主循环：requestAnimationFrame + 固定逻辑步长（1/60s）
 * ========================================================================== */
const STEP = 1 / 60;
let lastTs = 0, acc = 0, rafCb = null;
function frame(ts) {
  if (!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if (dt > 0.1) dt = 0.1;              // 切后台回来防跳变
  processClick();
  acc += dt;
  while (acc >= STEP) { Game.update(STEP); acc -= STEP; }
  Input.endFrame();
  render();
  rafCb = requestAnimationFrame(frame);
}

/* ============================================================================
 * 20. 启动 & 对外接口（精灵替换 / 调试 / 自检）
 * ========================================================================== */
Input.init();
window.addEventListener('blur', () => { if (Game.state === 'play') Game.state = 'pause'; });
canvas.addEventListener('mousedown', e => { const p = toLogical(e); pendingClick = p; });
requestAnimationFrame(frame);

// 浏览器控制台可用：__game.addScore(100) / __game.forceDive() 等做自检
window.__game = {
  CONFIG, Game, Spawner, Sound, Sprites, Input,
  get dove() { return Game.dove; },
  get falcon() { return Game.falcon; },
  get foods() { return Game.foods; },
  addScore(n) { Game.addScore(n, Game.dove.x, Game.dove.y - 60); },
  spawnFoodAt(x, row, kind, b) { const f = new Food(kind, x, row, b == null ? null : b); f.dropT = 0; Game.foods.push(f); return f; },
  forceDive() { const F = Game.falcon; F.state = 'dive'; F.diveT = 0; F.x = Game.dove.x + 12; F.y = 270; F.vx = 0; F.vy = CONFIG.FALCON.diveSpeed; },
};
window.setSprite = setSprite;

})();
</script>
