plugins {
    id 'com.android.application'
}

android {
    namespace 'com.weirdcore.twoworlds'
    compileSdk 35

    defaultConfig {
        applicationId 'com.weirdcore.twoworlds'
        minSdk 23
        targetSdk 35
        versionCode 21
        versionName '2.1'
    }

    buildTypes {
        debug { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
