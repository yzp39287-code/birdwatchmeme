[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  included_files = ["netlify/functions/dove-sequel.html"]

[[redirects]]
  from = "/netlify/functions/dove-sequel.html"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/netlify/functions/dove-sequel.js"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
