<!doctype html><html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理员控制台｜观鸟meme</title><meta name="robots" content="noindex,nofollow">
<link rel="icon" href="../assets/birdwatch-logo.jpg"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="admin.css">
</head><body>
<header><a class="brand" href="../"><span class="logo"><img src="../assets/birdwatch-logo.jpg" alt=""></span>观鸟<span>meme</span></a><div class="actions"><a class="console-link" href="../">返回网站</a><button id="logoutBtn" class="ghost hidden">退出</button></div></header>
<main class="console-shell">
 <section id="gate" class="gate"><h1>管理员控制台</h1><p>请使用网站管理员 GitHub 账号登录。普通用户无法进入此页面。</p><button id="loginBtn" class="primary">使用 GitHub 登录</button><p id="gateMessage"></p></section>
 <div id="console" class="hidden">
  <section class="console-head"><div><p class="eyebrow">仅管理员可见</p><h1>管理员控制台</h1><p>集中管理图片、分区、专题和投票。永久删除前请先导出备份。</p></div><button id="exportBtn" class="primary">导出数据备份</button></section>
  <section class="stats" id="stats"></section>
  <nav class="tabs" aria-label="管理功能"><button class="active" data-tab="works">作品管理</button><button data-tab="contest">专题与投票</button><button data-tab="categories">一级分区</button></nav>
  <section id="works" class="panel"><div class="toolbar"><input id="search" type="search" placeholder="搜索标题、配文或来源"><select id="categoryFilter"><option value="">全部分区</option></select><select id="visibilityFilter"><option value="">全部状态</option><option value="public">公开</option><option value="hidden">已隐藏</option></select></div><div id="workList" class="work-list"></div></section>
  <section id="contest" class="panel hidden"><div class="settings-card"><form id="contestForm"><label class="switch-row"><input name="is_open" type="checkbox"> 开启投票</label><label>截止时间（可留空）<input name="ends_at" type="datetime-local"></label><button class="primary" type="submit">保存设置</button></form></div><div class="panel-heading"><div><h2>专题作品</h2><p>可入选、移除并修改编号；票数来自数据库实时统计。</p></div></div><div id="contestList" class="contest-list"></div></section>
  <section id="categories" class="panel hidden"><div class="taxonomy-settings"><div class="settings-card"><h2>一级分区</h2><form id="categoryForm"><label>新分区名称<input name="name" maxlength="12" required placeholder="例如：鹭科"></label><button class="primary" type="submit">增加一级分区</button></form></div><div class="settings-card"><h2>二级分区</h2><form id="subcategoryForm"><label>所属一级分区<select name="parent_name" required></select></label><label>二级分区名称<input name="name" maxlength="16" required placeholder="例如：北红尾鸲"></label><button class="primary" type="submit">增加二级分区</button></form></div></div><div id="categoryList" class="category-list"></div><div id="subcategoryList" class="subcategory-list"></div></section>
 </div>
</main>
<dialog id="editDialog"><button class="close" data-close>×</button><h2>编辑作品</h2><form id="editForm"><input name="id" type="hidden"><label>标题<input name="title" maxlength="40" required></label><label>配文<textarea name="caption" maxlength="120" required></textarea></label><label>一级分区<select name="category" required></select></label><label>二级分区（可选）<select name="subcategory"><option value="">不设置</option></select></label><label>作者/投稿者<input name="author_name" maxlength="60"></label><label>图片来源<input name="source_name" maxlength="80"></label><label>来源链接<input name="source_url" type="url" placeholder="https://"></label><label class="switch-row"><input name="is_hidden" type="checkbox"> 立即从网站下架</label><p id="editMessage"></p><button class="primary" type="submit">保存修改</button></form></dialog>
<dialog id="deleteDialog"><button class="close" data-close>×</button><h2>确认永久删除</h2><p>此操作会删除数据库记录和 Storage 图片，无法撤销。建议先隐藏并观察几天。</p><p>请输入作品标题 <strong id="deleteTitle"></strong>：</p><form id="deleteForm"><input name="id" type="hidden"><input name="confirm_title" autocomplete="off" required><button class="danger" type="submit">永久删除</button></form></dialog>
<div id="notice" class="notice hidden" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script src="admin.js"></script>
</body></html>
